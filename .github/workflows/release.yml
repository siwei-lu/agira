name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
      - name: Rename binary
        run: cp target/aarch64-apple-darwin/release/agira agira-aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: agira-aarch64-apple-darwin
          path: agira-aarch64-apple-darwin

  build-macos-amd64:
    name: Build macOS amd64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build
        run: cargo build --release --target x86_64-apple-darwin
      - name: Rename binary
        run: cp target/x86_64-apple-darwin/release/agira agira-x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: agira-x86_64-apple-darwin
          path: agira-x86_64-apple-darwin

  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Rename binary
        run: cp target/x86_64-unknown-linux-gnu/release/agira agira-x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: agira-x86_64-unknown-linux-gnu
          path: agira-x86_64-unknown-linux-gnu

  release:
    name: Create Release
    needs: [build-macos-arm64, build-macos-amd64, build-linux-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agira-aarch64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: agira-x86_64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: agira-x86_64-unknown-linux-gnu
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            agira-aarch64-apple-darwin
            agira-x86_64-apple-darwin
            agira-x86_64-unknown-linux-gnu
